{% extends 'base.html' %}
{% block content %}
<h2 class="text-xl font-bold mb-4 text-[#5A827E]">Forgot Password?</h2>
<p class="mb-4 text-sm text-gray-600">Enter your email and we’ll send you a link to reset your password.</p>

<form method="post" class="space-y-4">
  {% csrf_token %}
  {{ form.email.label_tag }}
  {{ form.email }}
  <button type="submit" class="bg-[#5A827E] hover:bg-[#46665f] text-white px-4 py-2 rounded">Send Reset Link</button>
</form>
{% endblock %}
