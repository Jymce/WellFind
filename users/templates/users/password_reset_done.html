{% extends 'base.html' %}
{% block title %}Email Sent{% endblock %}

{% block content %}
<div class="min-h-[80vh] flex items-center justify-center px-4">
  <div class="w-full max-w-md bg-white p-8 rounded-lg shadow-md animate-fadeIn text-center">
    <h2 class="text-2xl font-bold text-[#5A827E] mb-4">Check Your Email</h2>
    <p class="text-sm text-gray-600 mb-6">
      We’ve emailed you a link to reset your password.<br>
      Please check your inbox and follow the instructions.
    </p>
    <a href="{% url 'login' %}" class="text-[#5A827E] text-sm hover:underline">Back to Login</a>
  </div>
</div>

<style>
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .animate-fadeIn {
    animation: fadeIn 0.5s ease-in-out;
  }
</style>
{% endblock %}
