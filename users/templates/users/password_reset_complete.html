{% extends 'base.html' %}
{% block title %}Password Reset Complete{% endblock %}

{% block content %}
<div class="min-h-[80vh] flex items-center justify-center px-4">
  <div class="w-full max-w-md bg-white p-8 rounded-lg shadow-md animate-fadeIn text-center">
    <h2 class="text-2xl font-bold text-[#5A827E] mb-4">Password Reset Complete</h2>
    <p class="text-sm text-gray-600 mb-6">
      Your password has been successfully reset. You may now
      <a href="{% url 'login' %}" class="text-[#5A827E] font-medium underline hover:text-[#46665f] transition">log in</a>
      with your new password.
    </p>
  </div>
</div>

<style>
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .animate-fadeIn {
    animation: fadeIn 0.5s ease-in-out;
  }
</style>
{% endblock %}
