{% extends "base.html" %}
{% block content %}
<div class="min-h-[calc(100vh-8rem)] flex items-center justify-center py-4">
  <div class="w-full max-w-md">
    
    <!-- Header -->
    <div class="text-center mb-6">
      <div class="inline-flex items-center space-x-2 mb-3">
        <div class="w-10 h-10 bg-gradient-to-br from-emerald-500 to-teal-600 rounded-xl flex items-center justify-center">
          <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 3l14 9-14 9V3z"/>
          </svg>
        </div>
        <span class="text-2xl font-bold bg-gradient-to-r from-emerald-600 to-teal-600 bg-clip-text text-transparent">
          WellFind
        </span>
      </div>
      <h1 class="text-2xl font-bold text-emerald-800 mb-1">Welcome Back</h1>
      <p class="text-emerald-600 text-sm">Sign in to your wellness journey</p>
    </div>

    <!-- Login Form -->
    <div class="bg-white/70 backdrop-blur-sm rounded-2xl shadow-xl border border-emerald-100 p-6">
      <form method="POST" class="space-y-4">
        {% csrf_token %}
        
        <!-- Error Messages -->
        {% if messages %}
          <div class="bg-red-50 border border-red-200 rounded-lg p-3">
            {% for message in messages %}
              <p class="text-red-700 text-sm">{{ message }}</p>
            {% endfor %}
          </div>
        {% endif %}

        <!-- Username Field -->
        <div class="space-y-2">
          <label for="username" class="block text-sm font-semibold text-emerald-800">Username</label>
          <input 
            type="text" 
            id="username" 
            name="username" 
            required
            class="w-full px-4 py-3 bg-white/80 border border-emerald-200 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 transition-all duration-200 text-emerald-800 placeholder-emerald-400"
            placeholder="Enter your username"
          />
        </div>

        <!-- Password Field -->
        <div class="space-y-2">
          <label for="password" class="block text-sm font-semibold text-emerald-800">Password</label>
          <div class="relative">
            <input 
              type="password" 
              id="password" 
              name="password" 
              required
              class="w-full px-4 py-3 bg-white/80 border border-emerald-200 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 transition-all duration-200 text-emerald-800 placeholder-emerald-400 pr-12"
              placeholder="Enter your password"
            />
            <button 
              type="button" 
              onclick="togglePassword('password', this)"
              class="absolute right-3 top-1/2 transform -translate-y-1/2 text-emerald-500 hover:text-emerald-600 transition-colors"
            >
              <svg id="eye-icon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.542-7a10.05 10.05 0 013.308-4.568M9.88 9.88a3 3 0 104.24 4.24M3 3l18 18"/>
              </svg>
            </button>
          </div>
          <div class="text-right">
            <!-- <a href="{% url 'password_reset' %}" class="text-sm text-emerald-600 hover:text-emerald-700 hover:underline transition-colors">
              Forgot password?
            </a> -->
          </div>
        </div>

        <!-- Submit Button -->
        <button 
          type="submit"
          class="w-full bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-600 hover:to-teal-700 text-white font-semibold py-3 px-4 rounded-lg transition-all duration-200 shadow-lg hover:shadow-xl transform hover:-translate-y-0.5"
        >
          Sign In
        </button>
      </form>

      <!-- Register Link -->
      <div class="mt-5 text-center">
        <p class="text-sm text-emerald-700">
          Don't have an account? 
          <a href="{% url 'register' %}" class="font-semibold text-emerald-600 hover:text-emerald-700 hover:underline transition-colors">
            Create one here
          </a>
        </p>
      </div>
    </div>

    <!-- Trust Indicators -->
    <div class="mt-6 flex items-center justify-center space-x-6 text-emerald-600">
      <div class="flex items-center space-x-1">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/>
        </svg>
        <span class="text-xs">Secure</span>
      </div>
      <div class="flex items-center space-x-1">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/>
        </svg>
        <span class="text-xs">Trusted</span>
      </div>
      <div class="flex items-center space-x-1">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 3l14 9-14 9V3z"/>
        </svg>
        <span class="text-xs">Natural</span>
      </div>
    </div>
  </div>
</div>

<script>
function togglePassword(id, button) {
  const input = document.getElementById(id);
  const isHidden = input.type === "password";
  input.type = isHidden ? "text" : "password";

  const svg = button.querySelector("svg");
  svg.innerHTML = isHidden
    ? `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.522 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.478 0-8.268-2.943-9.542-7z"/>`
    : `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.542-7a10.05 10.05 0 013.308-4.568M9.88 9.88a3 3 0 104.24 4.24M3 3l18 18"/>`;
}
</script>
{% endblock %}
